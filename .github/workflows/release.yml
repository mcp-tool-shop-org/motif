name: Release

# Publishes every public @motif-studio package to npm when a GitHub release is
# published.
#
# THE FILENAME IS LOAD-BEARING. npm's Trusted Publisher config for these
# packages names this workflow (`release.yml`) explicitly, and npm checks that
# name in the OIDC token claim. Renaming or moving this file breaks publishing
# until the Trusted Publisher entry is updated to match on npmjs.com.
#
# Auth is OIDC — there is deliberately no NPM_TOKEN here, and none is needed.
# `id-token: write` is what lets npm mint a short-lived credential for this
# exact repo + workflow, so no long-lived publish token exists to leak.
#
# pnpm is pinned to 10.x through the root `packageManager` field, which matters:
# pnpm 10 publishes correctly over OIDC, and pnpm 11.0.8 regressed it to a 404
# (pnpm/pnpm#11513). Do not float this to 11 without re-verifying a publish.

# Published releases only — deliberately no `workflow_dispatch` and no push
# trigger. A manual dispatch would happily publish whatever versions sit on the
# branch it was run from, and npm versions are immutable and un-unpublishable
# after 72 hours. To retry a failed publish, re-run this workflow from the
# Actions tab on the run that failed, or set the release back to draft and
# publish it again.
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Build the tag that was released, not whatever main points at now.
          ref: ${{ github.event.release.tag_name || github.ref }}
          repository: ${{ github.repository }}
          persist-credentials: false
          fetch-depth: 1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # NO `registry-url` here, deliberately. Setting it makes setup-node write
      # an .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`.
      # Under OIDC there is no such token, so it expands to an empty placeholder,
      # the request authenticates as nobody, and npm answers `404 PUT` — which is
      # what it returns instead of 403 when you cannot write to a package that
      # already exists. Trusted Publishing is never reached. Leaving the registry
      # unset lets pnpm's own OIDC path mint the credential. (Measured: the first
      # v1.3.0 attempt died exactly this way on @motif-studio/test-kit.)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Gate the publish on the same checks CI runs. A release tag that cannot
      # build or pass its tests must not reach the registry, where versions are
      # immutable and un-unpublishable after 72 hours.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm vitest run

      # Publish with npm, pack with pnpm — each does the half it is good at.
      #
      # npm has native OIDC Trusted Publishing from 11.5.1; Node 22 still ships
      # npm 10, so upgrade it explicitly. pnpm 10.32.1 does NOT attempt OIDC —
      # `pnpm publish` here fails ENEEDAUTH, having never tried to mint a
      # credential.
      #
      # But only pnpm can rewrite the `workspace:*` interdependencies into real
      # versions; publishing these package.json files as they sit on disk would
      # ship manifests no consumer could install. So `pnpm pack` builds the
      # tarball (verified: it emits `"@motif-studio/schema": "1.3.0"`, not
      # `workspace:*`) and `npm publish <tarball>` sends it under OIDC.
      - name: Publish packages
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) — OIDC Trusted Publishing needs >= 11.5.1"
          published=0
          for dir in packages/*/; do
            [ -f "${dir}package.json" ] || continue
            name=$(node -p "require('./${dir}package.json').name")
            private=$(node -p "require('./${dir}package.json').private === true")
            if [ "$private" = "true" ]; then
              echo "skip $name (private)"
              continue
            fi
            echo "::group::publish $name"
            tarball=$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)
            npm publish "$tarball" --access public
            published=$((published + 1))
            echo "::endgroup::"
          done
          echo "published $published package(s)"
